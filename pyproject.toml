[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "scraped"
version = "0.0.13"
description = "Tools for scraping"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = [
    { name = "Thor Whalen" },
]
dependencies = [
    "graze",
    "scrapy",
    "config2py",
    "markdownify>=1.0",  # MIT HTML->Markdown; replaced html2text (GPL-3.0-or-later)
    "beautifulsoup4",  # imported by util.py to strip non-content tags pre-convert
    "lkj",
    "argh",
    "requests",   # imported at module scope by tools.py/util.py; was only
                  # resolving transitively via tldextract
    # acquisition core
    "curl_cffi",  # browser-impersonating transport (rung 2) - the default
    "protego",    # RFC 9309 robots.txt; stdlib robotparser gets wildcards wrong
    "dol",        # Mapping-shaped stores, so local-dir -> S3 is a constructor change
]


[project.urls]
Homepage = "https://github.com/thorwhalen/scraped"

[project.optional-dependencies]
browser = [
    "patchright",  # patched Playwright; transport rungs 4-5
]
dom = [
    "selectolax",  # only needed when you must actually parse the DOM (rung e)
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[project.scripts]
scraped = "scraped.tools:main"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "scraped",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = "scraped"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
    "--doctest-modules",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
